<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="meat" x1="0" x2="1">
      <stop offset="0" stop-color="#6b2a18"/>
      <stop offset=".45" stop-color="#b4502e"/>
      <stop offset=".7" stop-color="#d98a5f"/>
      <stop offset="1" stop-color="#7b3520"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c99863"/>
      <stop offset="1" stop-color="#a77744"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc46a"/>
      <stop offset=".35" stop-color="#e3eeb4"/>
      <stop offset="1" stop-color="#fbf7dc"/>
    </linearGradient>
    <g id="slice">
      <rect x="-20" y="-58" width="40" height="104" rx="17" fill="url(#meat)"/>
      <rect x="11" y="-54" width="8" height="96" rx="4" fill="#aab3be" opacity=".75"/>
      <rect x="-12" y="-48" width="8" height="74" rx="4" fill="#fff" opacity=".22"/>
    </g>
    <g id="cab">
      <path d="M0 0 C40 -40 140 -50 200 -10 C220 10 200 40 160 50 C100 66 30 50 0 0Z" fill="url(#leaf)"/>
      <path d="M10 2 C70 10 130 14 196 -4" stroke="#fffbe8" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M60 8 l20 -30 M110 12 l26 -34 M90 10 l10 28 M140 10 l14 30" stroke="#d5e2a0" stroke-width="2" fill="none"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="#ece3d4"/>
  <!-- 도마 -->
  <rect x="58" y="96" width="684" height="430" rx="30" fill="#000" opacity=".12" transform="translate(6 10)"/>
  <rect x="58" y="96" width="684" height="430" rx="30" fill="url(#wood)"/>
  <g stroke="#8e6235" stroke-width="2" opacity=".35" fill="none">
    <path d="M80 160 Q400 140 720 170"/><path d="M80 250 Q400 230 720 260"/>
    <path d="M80 350 Q400 335 720 360"/><path d="M80 450 Q400 430 720 455"/>
  </g>
  <!-- 김 -->
  <g transform="rotate(-8 170 200)">
    <rect x="96" y="128" width="150" height="150" rx="6" fill="#1b2620"/>
    <rect x="104" y="120" width="150" height="150" rx="6" fill="#24332a"/>
    <rect x="112" y="112" width="150" height="150" rx="6" fill="#2b3d32"/>
    <path d="M130 140 l60 20 M150 200 l70 -10 M140 230 l50 10" stroke="#3d5546" stroke-width="2"/>
  </g>
  <!-- 배추 -->
  <use href="#cab" transform="translate(96 380) rotate(-6)"/>
  <use href="#cab" transform="translate(120 430) rotate(4)"/>
  <!-- 과메기 -->
  <g transform="translate(400 300)">
    <use href="#slice" transform="translate(-90 0) rotate(-10)"/>
    <use href="#slice" transform="translate(-45 4) rotate(-5)"/>
    <use href="#slice" transform="translate(0 6)"/>
    <use href="#slice" transform="translate(45 4) rotate(5)"/>
    <use href="#slice" transform="translate(90 0) rotate(10)"/>
  </g>
  <!-- 미역 -->
  <g transform="translate(520 120)">
    <path d="M0 40 C30 0 60 60 90 20 C120 -10 150 50 190 20 L196 70 C160 100 130 40 100 80 C70 110 40 60 10 100Z" fill="#2d5b3a"/>
    <path d="M10 70 C50 40 90 80 180 45" stroke="#3f7a4e" stroke-width="5" fill="none"/>
  </g>
  <!-- 쪽파 -->
  <g stroke-linecap="round" stroke-width="9">
    <path d="M300 470 L560 440" stroke="#4f9a3c"/>
    <path d="M300 484 L560 458" stroke="#5aa845"/>
    <path d="M300 456 L540 426" stroke="#438a33"/>
    <path d="M300 470 L340 466 M300 484 L338 480 M300 456 L338 452" stroke="#f3f1e2"/>
  </g>
  <!-- 마늘 그릇 -->
  <circle cx="640" cy="276" r="56" fill="#fff" stroke="#dde1e6" stroke-width="3"/>
  <g fill="#fbf4dd" stroke="#e1d3a8" stroke-width="2">
    <ellipse cx="622" cy="262" rx="14" ry="10"/><ellipse cx="652" cy="258" rx="14" ry="10"/>
    <ellipse cx="636" cy="286" rx="14" ry="10"/><ellipse cx="664" cy="292" rx="12" ry="9"/>
    <ellipse cx="612" cy="294" rx="12" ry="9"/>
  </g>
  <!-- 고추 그릇 -->
  <circle cx="640" cy="420" r="50" fill="#fff" stroke="#dde1e6" stroke-width="3"/>
  <g fill="#e8f3d3" stroke-width="5">
    <circle cx="624" cy="408" r="9" stroke="#3f8a33"/><circle cx="650" cy="404" r="9" stroke="#d23a24"/>
    <circle cx="640" cy="430" r="9" stroke="#3f8a33"/><circle cx="662" cy="428" r="8" stroke="#3f8a33"/>
    <circle cx="618" cy="432" r="8" stroke="#d23a24"/>
  </g>
  <!-- 초장 -->
  <circle cx="270" cy="208" r="44" fill="#fff" stroke="#dde1e6" stroke-width="3" transform="translate(40 -60)"/>
  <circle cx="310" cy="148" r="32" fill="#c4301c"/>
  <ellipse cx="300" cy="138" rx="10" ry="5" fill="#fff" opacity=".35"/>
</svg>
