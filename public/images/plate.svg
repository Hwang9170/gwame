<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="meat" x1="0" x2="1">
      <stop offset="0" stop-color="#6b2a18"/>
      <stop offset=".45" stop-color="#b4502e"/>
      <stop offset=".7" stop-color="#d98a5f"/>
      <stop offset="1" stop-color="#7b3520"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" x2="1">
      <stop offset="0" stop-color="#7e8794"/>
      <stop offset="1" stop-color="#c7ced8"/>
    </linearGradient>
    <radialGradient id="tbl" cx=".5" cy=".4" r=".8">
      <stop offset="0" stop-color="#34445a"/>
      <stop offset="1" stop-color="#18222f"/>
    </radialGradient>
    <g id="slice">
      <rect x="-24" y="-72" width="48" height="124" rx="20" fill="url(#meat)"/>
      <rect x="14" y="-68" width="9" height="116" rx="4.5" fill="url(#skin)" opacity=".75"/>
      <rect x="-14" y="-60" width="9" height="90" rx="4.5" fill="#fff" opacity=".22"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="url(#tbl)"/>
  <!-- 천 냅킨 -->
  <path d="M560 380 L800 330 V600 H600Z" fill="#e9e1d2"/>
  <path d="M560 380 L800 330" stroke="#c8bba5" stroke-width="3"/>
  <!-- 그림자 -->
  <ellipse cx="400" cy="318" rx="248" ry="244" fill="#000" opacity=".3"/>
  <!-- 접시 -->
  <circle cx="400" cy="300" r="240" fill="#f9f7f2"/>
  <circle cx="400" cy="300" r="226" fill="none" stroke="#2f5d8a" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="400" cy="300" r="206" fill="#f1eee6"/>
  <!-- 과메기 -->
  <g transform="translate(400 300)">
    <use href="#slice" transform="rotate(0) translate(0 -128)"/>
    <use href="#slice" transform="rotate(30) translate(0 -128)"/>
    <use href="#slice" transform="rotate(60) translate(0 -128)"/>
    <use href="#slice" transform="rotate(90) translate(0 -128)"/>
    <use href="#slice" transform="rotate(120) translate(0 -128)"/>
    <use href="#slice" transform="rotate(150) translate(0 -128)"/>
    <use href="#slice" transform="rotate(180) translate(0 -128)"/>
    <use href="#slice" transform="rotate(210) translate(0 -128)"/>
    <use href="#slice" transform="rotate(240) translate(0 -128)"/>
    <use href="#slice" transform="rotate(270) translate(0 -128)"/>
    <use href="#slice" transform="rotate(300) translate(0 -128)"/>
    <use href="#slice" transform="rotate(330) translate(0 -128)"/>
  </g>
  <!-- 초장 그릇 -->
  <circle cx="400" cy="304" r="58" fill="#000" opacity=".12"/>
  <circle cx="400" cy="300" r="56" fill="#fff" stroke="#dfe3e8" stroke-width="3"/>
  <circle cx="400" cy="300" r="42" fill="#c4301c"/>
  <ellipse cx="386" cy="286" rx="14" ry="7" fill="#fff" opacity=".35"/>
  <!-- 고명 -->
  <g fill="#4f9a3c">
    <rect x="300" y="250" width="22" height="7" rx="3.5" transform="rotate(-30 311 253)"/>
    <rect x="480" y="340" width="22" height="7" rx="3.5" transform="rotate(20 491 343)"/>
    <rect x="470" y="232" width="18" height="6" rx="3" transform="rotate(50 479 235)"/>
    <rect x="318" y="356" width="18" height="6" rx="3" transform="rotate(-60 327 359)"/>
  </g>
  <g fill="none" stroke-width="4">
    <circle cx="350" cy="220" r="7" stroke="#d23a24"/>
    <circle cx="452" cy="382" r="7" stroke="#3f8a33"/>
    <circle cx="460" cy="210" r="6" stroke="#3f8a33"/>
    <circle cx="336" cy="392" r="6" stroke="#d23a24"/>
  </g>
  <g fill="#fbf4dd" stroke="#e6d9b0" stroke-width="1.5">
    <ellipse cx="490" cy="290" rx="8" ry="6"/><ellipse cx="310" cy="310" rx="8" ry="6"/>
  </g>
  <!-- 젓가락 -->
  <g transform="rotate(-18 690 250)">
    <rect x="640" y="70" width="10" height="330" rx="5" fill="#b9bec6"/>
    <rect x="664" y="70" width="10" height="330" rx="5" fill="#a7adb6"/>
  </g>
</svg>
